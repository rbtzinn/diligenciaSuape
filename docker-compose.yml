# ==========================================================
# DILIGÊNCIA 360 — Firebase Auth + Google Sheets
# ==========================================================

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: diligencia360_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_SHEETS_CLIENT_EMAIL:-}
      GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_SHEETS_PRIVATE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      CGU_API_KEY: ${CGU_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      ADVERSE_MEDIA_MAX_QUERIES: ${ADVERSE_MEDIA_MAX_QUERIES:-9}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      DUCKDUCKGO_SEARCH_ENABLED: ${DUCKDUCKGO_SEARCH_ENABLED:-true}
    depends_on:
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3000:3000"
    networks:
      - diligencia_net

  # Metabusca aberta: dá ao backend um canal web gratuito, sem chave de API.
  # Publicada só em loopback (127.0.0.1:8888) para uso do backend em dev.
  searxng:
    image: searxng/searxng:latest
    container_name: diligencia360_searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_URL:-http://searxng:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-troque-esta-chave}
    volumes:
      - ./searxng:/etc/searxng:rw
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - diligencia_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    container_name: diligencia360_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - diligencia_net

networks:
  diligencia_net:
    driver: bridge
